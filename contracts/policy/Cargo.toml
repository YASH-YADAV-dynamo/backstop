[package]
name = "backstop-policy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.1", features = ["unstable"] }
omni-transaction = { version = "0.5.0", default-features = false, features = ["evm"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rlp = "0.6"
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
