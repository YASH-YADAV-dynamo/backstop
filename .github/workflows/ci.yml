name: CI

# Build check only. Nothing here deploys: the site and bot are updated by hand on the host.
on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repo; the token gets nothing else. No secrets are used or needed.
permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backstop/web typecheck
      - run: pnpm --filter @backstop/web test
      - run: pnpm --filter @backstop/web build
